<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Things I Don't Tell You Enough ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="secret-things-page">

  <!-- Floating ambient hearts container in background -->
  <div class="ambient-hearts-container" id="ambientHearts" aria-hidden="true"></div>

  <!-- Page Top Navigation -->
  <nav class="page-top-nav" aria-label="Page Navigation">
    <a href="index.html" class="page-nav-back">
      <span>← Home</span>
    </a>
  </nav>

  <!-- Main Content Area -->
  <main class="main-wrapper">
    
    <!-- SECRET PAGE 3: THINGS I DON'T TELL YOU ENOUGH -->
    <section class="screen secret-things-screen active" id="secretThingsScreen">
      
      <div class="secret-things-card" id="thingsCard" role="button" tabindex="0" aria-label="Tap to reveal next sentence">
        
        <div class="things-top-row">
          <span class="things-counter-badge" id="thingsCounter">1 / 6</span>
          <span class="things-hint-badge">Tap card to continue ✨</span>
        </div>

        <h1 class="secret-things-title">Things I Don't Tell You Enough</h1>

        <div class="things-divider"></div>

        <!-- Dynamic Reveal Area -->
        <div class="things-display-box" id="thingsDisplayBox">
          <p class="things-message-text" id="thingsMessageText">I'm proud of you.</p>
        </div>

        <div class="things-action-hint">
          <span id="thingsTapHint">Tap anywhere to reveal next... ♡</span>
        </div>

      </div>

      <!-- Sequential Transition to Secret 4 -->
      <div class="section-transition-box" id="thingsContinueBox" style="margin-top: 2.2rem; opacity: 0; pointer-events: none; transition: opacity 0.5s ease;">
        <a href="secret-forget.html" class="next-section-btn" id="goToSecret4Btn">
          <span>Continue →</span>
        </a>
      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
