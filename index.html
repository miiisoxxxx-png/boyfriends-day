<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>A Website Made Just For You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Floating ambient hearts container in background -->
  <div class="ambient-hearts-container" id="ambientHearts" aria-hidden="true"></div>

  <!-- Main Content Area -->
  <main class="main-wrapper">
    
    <!-- PAGE 1: HOMEPAGE / HERO SCREEN -->
    <section class="screen hero-screen active" id="heroScreen">
      <div class="hero-card">
        <div class="hero-deco-top">
          <svg class="heart-icon-hero secret-heart-btn" id="secretHeart" viewBox="0 0 24 24" fill="#5D0703" role="button" tabindex="0" aria-label="Secret heart">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>

        <p class="hero-theme-tag">A Website Made Just For You</p>

        <div class="hero-message-box">
          <h1 class="hero-heading">HEY YOU.</h1>
          <p class="hero-subline">Yeah, you.</p>
          <p class="hero-body">
            For my babyyyy who's currently reading this~<br>
            I made you something.<br>
            Don't get too excited.
          </p>
        </div>

        <div class="hero-action-area">
          <a href="reasons.html" class="enter-button" id="enterBtn" aria-label="Enter the website">
            <span>ENTER →</span>
          </a>
        </div>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
