<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Secret Unlock ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="secret-unlock-page">

  <!-- Floating ambient hearts container in background -->
  <div class="ambient-hearts-container" id="ambientHearts" aria-hidden="true"></div>

  <!-- Page Top Navigation -->
  <nav class="page-top-nav" aria-label="Page Navigation">
    <a href="index.html" class="page-nav-back">
      <span>← Back to Home</span>
    </a>
  </nav>

  <!-- Main Content Area -->
  <main class="main-wrapper">
    
    <section class="screen secret-unlock-screen active" id="unlockScreen">
      
      <div class="secret-unlock-card" id="secretUnlockCard">
        
        <div class="secret-card-icon">👀</div>
        
        <h1 class="secret-unlock-title">Okay... you found the heart. 👀</h1>
        
        <div class="secret-prompt-group">
          <p class="secret-unlock-sub">Before I let you in...</p>
          <p class="secret-unlock-question">What's the date we first started dating?</p>
        </div>

        <form class="secret-password-form" id="secretPasswordForm" onsubmit="return false;">
          <div class="input-wrapper">
            <input 
              type="text" 
              class="secret-pass-input" 
              id="secretPassInput" 
              placeholder="Enter the date..."
              autocomplete="off" 
              spellcheck="false"
              aria-label="Date we first started dating"
            />
          </div>

          <p class="secret-error-msg" id="secretErrorMsg" style="display: none;">Nope 😭 Try again...</p>

          <button type="submit" class="secret-unlock-submit-btn" id="secretSubmitBtn">
            <span>Unlock ♡</span>
          </button>
        </form>

      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
